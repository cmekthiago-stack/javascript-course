<!DOCTYPE html>
<html lang="en">
<head>
  <title>Rock Paper Scissors</title>
  <link rel="stylesheet" href="styles/12x.css">
</head>
<body>
  <P class="title">Rock Paper Scissors</P>
  <button class="move-button js-rock-button"><img src="images/rock-emoji.png" class="move-icon"></button>

  <button class="move-button js-paper-button"

  ><img src="images/paper-emoji.png" class="move-icon"></button>

  <button class="move-button js-scissors-button"

  ><img src="images/scissors-emoji.png" class="move-icon"></button>

  <p class="js-result" class="result">You win</p>
  <p class="js-moves"></p>
  <p class="js-score" class="score"></p>

 <button class="reset-score-button js-reset-score-button">
  Reset Score
</button>

  <button class="auto-play-button js-auto-play-button">
  Auto Play
</button>
<p class="js-reset-confirmation"></p>


  <script src="scripts/12x.js"></script>  
</body>
</html>
