<!DOCTYPE html>
<html lang="en">
<head>
  <title>Rock Paper Scissors</title>
</head>
<body>
  <P>Rock Paper Scissors</P>
  <button onclick="
  playGame('Rock');
    ">Rock</button>

  <button onclick=" 
   playGame('Paper');
  "
  >Paper</button>

  <button onclick=" 
  playGame('Scissors');  "
  >Scissors</button>

  <p class="js-result"></p>
  <p class="js-moves"></p>
  <p class="js-score"></p>

  <button onclick="
  score.wins = 0;
  score.losses = 0;
  score.ties = 0;
  localStorage.removeItem('score'); // removes the score from local storage
  updateScoreElement(); // updates the score display on the page
  ">Reset Score</button>


  <script>
    let score = JSON.parse(localStorage.getItem('score')) || {  
      wins: 0,
      losses: 0,
      ties: 0
        }; // retrieves the score from local storage, if it exists

    updateScoreElement(); // updates the score display on the page

        /*
    if (!score) {
        score = {
            wins: 0,
            losses: 0,
            ties: 0
        };
    } */


    function playGame(playerMove){      
      const computerMove = pickComputerMove(); 

      let result = '';

      if(playerMove === 'Scissors'){            
          if (computerMove === 'Rock'){
            result = 'lose';
          } else if (computerMove === 'Paper'){
            result = 'You win';
          } else if (computerMove === 'Scissors'){
            result = 'You tie';
          }   

      } else if (playerMove === 'Paper') {
          if (computerMove === 'Rock'){
          result = 'You win';
          } else if (computerMove === 'Paper'){
            result = 'You tie';
          } else if (computerMove === 'Scissors'){
            result = 'You lose';
          }
          
      } else if (playerMove === 'Rock'){
          if (computerMove === 'Rock'){
              result = 'Tie';
            } else if (computerMove === 'Paper'){
              result = 'You lose';
            } else if (computerMove === 'Scissors'){
              result = 'You Win';
            }
      }

      if(result === 'You win'){
        score.wins += 1;
      } else if (result === 'You lose'){
        score.losses += 1;
      } else if (result === 'You tie'){
        score.ties += 1;
      }

    localStorage.setItem('score', JSON.stringify(score)); // saves the score object to local storage as a JSON string

    updateScoreElement(); // updates the score display on the page

    document.querySelector('.js-result').innerHTML = result;
    document.querySelector('.js-moves').innerHTML = `You ${playerMove} - ${computerMove} computer`;
   }

   function updateScoreElement(){
    document.querySelector('.js-score')
    .innerHTML = `Wins: ${score.wins}, Losses: ${score.losses}, Ties: ${score.ties}`;
   }


    function pickComputerMove(){            
      const randomNumber = Math.random();  
      let computerMove = '';     
      
      if(randomNumber >= 0 && randomNumber < 1 / 3){
        computerMove = 'Rock';
      } else if (randomNumber >= 1 / 3 && randomNumber < 2 / 3){
        computerMove = 'Paper';
      } else if (randomNumber >= 2 / 3 && randomNumber < 1){ 
        computerMove = 'Scissors';
      }  
      return computerMove;
    }
     
  </script>  
</body>
</html>
