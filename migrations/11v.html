<!DOCTYPE html>
<html lang="en">
<head>
  <title>fizzbuzzment</title>
</head>
<body>
  <script>
    function fizzbuzzment(n) {
      for (let i = 1; i <= n; i++) {
        if (i % 3 === 0 ) {
          console.log("Fizz");
        } else if (i % 5 === 0) {
          console.log("Buzz");
        } else if (i % 3 === 0 && i % 5 === 0) {
          console.log("FizzBuzz");
        } else {
          console.log(i);
        }
      }
    }
    fizzbuzzment(20);



  </script>
  
</body>
</html>
