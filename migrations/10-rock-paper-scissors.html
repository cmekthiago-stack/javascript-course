<!DOCTYPE html>
<html lang="en">
<head>
  <title>Rock Paper Scissors</title>
  <link rel="stylesheet" href="styles/10-rock-paper-scissors.css">
</head>
<body>
  <P class="title">Rock Paper Scissors</P>
  <button onclick="
  playGame('Rock');

    " class="move-button"><img src="images/rock-emoji.png" class="move-icon"></button>

  <button onclick=" 
   playGame('Paper');"
   class="move-button"

  ><img src="images/paper-emoji.png" class="move-icon"></button>

  <button onclick=" 
  playGame('Scissors');"
  class="move-button"

  ><img src="images/scissors-emoji.png" class="move-icon"></button>

  <p class="js-result" class="result">You win</p>
  <p class="js-moves"></p>
  <p class="js-score" class="score"></p>

  <button onclick="
  score.wins = 0;
  score.losses = 0;
  score.ties = 0;
  localStorage.removeItem('score'); // removes the score from local storage
  updateScoreElement(); // updates the score display on the page
  " class="reset-score-button">Reset Score</button>


  <script src="scripts/10-rock-paper-scissors.js"></script>  
</body>
</html>
