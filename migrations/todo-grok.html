<!DOCTYPE html>
<html lang="en">
<head>
  <title>Document</title>
  <style>
  body {
  font-family: Arial;
}

.todo-grid,
.todo-input-grid {
  display: grid;
  grid-template-columns: 250px 180px 120px;   /* ← Fixed: spaces, not commas */
  column-gap: 15px;
  row-gap: 12px;
  align-items: center;
}

.todo-input-grid {
  margin-bottom: 20px;
  align-items: stretch;
}

.name-input,
.due-date-input {
  font-size: 15px;
  padding: 8px 10px;
  border: 1px solid #ccc;
  border-radius: 4px;
}

.add-todo-button {
  background-color: #4CAF50;
  color: white;
  font-size: 15px;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  padding: 8px 16px;
}

.add-todo-button:hover {
  background-color: #45a049;
}

.delete-button {
  background-color: #d32f2f;
  color: white;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  font-size: 14px;
  padding: 8px 12px;
}

.delete-button:hover {
  background-color: #b71c1c;
}

/* Optional: Better visual separation */
.todo-grid > div:nth-child(3n+3) {
  justify-self: start;
}
.todo-grid,
.todo-input-grid {
  grid-template-columns: 1fr 1fr auto;   /* flexible columns */
  min-width: 500px;
}
  </style>
</head>
<body>
  <div class="todo-grid" style="font-weight: bold; margin-bottom: 8px;">
  <div>Todo Name</div>
  <div>Due Date</div>
  <div>Action</div>
</div>
<p>Todo List</p>

  <div class="todo-input-grid">
    <input placeholder="Todo name"
     class="js-todo name-input">
    <input type="date" 
    class="js-due-date due-date-input">
    <button onclick="
    addTodo();" 
    class="add-todo-button">Add</button>
  </div>

  <div class="js-todo-list todo-grid" ></div>

  <script>
    
  const todoList = JSON.parse(localStorage.getItem('todoList')) || [{
    name: 'are u hungry??', 
    dueDate: '2022-01-01'
  }, {
    name: 'wash the dishes',
    dueDate: '2022-01-01'
  }];

  renderTodoList();

  function renderTodoList(){
    let todoListHtml = '';

    for (let i = 0; i < todoList.length; i++){
      const todoObject = todoList[i];
      //const name =todoObject.name
      //const dueDate = todoObject.dueDate;
      const {name, dueDate} = todoObject;
      const html = ` 
      <div>${name}</div>
      <div>${dueDate}</div>    
      <button onclick="
          todoList.splice(${i}, 1);
          renderTodoList(); 


          saveToStorage();
      " class="delete-button">Delete</button>
    `;
      todoListHtml += html;
    }  

    document.querySelector('.js-todo-list').
    innerHTML = todoListHtml;
  }

  function addTodo(){
    const inputElement = document.querySelector('.js-todo');
    const name = inputElement.value;

    const dateInputElement = document.querySelector('.js-due-date');
    const dueDate = dateInputElement.value;
    
    todoList.push({ 
    // name: name,
      //dueDate: dueDate,  
      name,
      dueDate,
    }); 

    inputElement.value = '';
    renderTodoList();
    saveToStorage();
  }

  function saveToStorage(){
    localStorage.setItem('todoList', JSON.stringify(todoList));  
  }
  </script>

  
</body>
</html>
